<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HFF AI Giving Assistant – POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7F2780; --purple-deep:#5A1A5C; --purple-soft:#F6EEF6; --purple-line:#E6D3E6;
  --green:#7DB33F; --green-ink:#3F6B12; --green-soft:#EFF6E6;
  --red:#E31C26; --ink:#2B1630; --ink-2:#5E4C63; --muted:#8A7A8E;
  --bg:#FFFFFF; --bg-2:#FBF7FB; --card:#FFFFFF; --line:#EBE2EC;
  --shadow:0 18px 40px -22px rgba(90,26,92,.35);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --purple:#C77BC8; --purple-deep:#E3B4E4; --purple-soft:#2C1A2F; --purple-line:#4A2E4D;
    --green:#9BD05E; --green-ink:#B5E07F; --green-soft:#1F2A16;
    --ink:#F5ECF6; --ink-2:#CDBFD0; --muted:#A495A8;
    --bg:#170E19; --bg-2:#1E1321; --card:#24172A; --line:#3A2A3E;
    --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --purple:#C77BC8; --purple-deep:#E3B4E4; --purple-soft:#2C1A2F; --purple-line:#4A2E4D;
  --green:#9BD05E; --green-ink:#B5E07F; --green-soft:#1F2A16;
  --ink:#F5ECF6; --ink-2:#CDBFD0; --muted:#A495A8;
  --bg:#170E19; --bg-2:#1E1321; --card:#24172A; --line:#3A2A3E;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);line-height:1.08;margin:0;color:var(--ink);letter-spacing:-.015em}
h1{font-size:clamp(2.4rem,5.6vw,4.3rem);font-weight:800}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:700}
h3{font-size:1.3rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* demo ribbon + header */
.ribbon{background:var(--purple-deep);color:#fff;font-size:.85rem;text-align:center;padding:7px 16px}
:root[data-theme="dark"] .ribbon{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ribbon{color:#170E19}}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:20px;height:76px}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:58px;height:50px;background:#fff;border-radius:14px;display:grid;place-items:center;padding:3px}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand b{font-family:var(--display);font-size:1.08rem;line-height:1.1;text-align:left;display:block}
.brand small{display:block;color:var(--muted);font-size:.78rem;text-align:left}
.links{display:flex;gap:4px;margin-left:auto}
.links button{background:none;border:0;padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-weight:600}
.links button:hover,.links button.on{background:var(--purple-soft);color:var(--purple)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:15px 26px;font-weight:700;cursor:pointer;font-size:1rem;transition:transform .15s ease, box-shadow .15s ease, background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--purple);color:#fff;box-shadow:0 10px 24px -12px var(--purple)}
.btn-primary:hover{background:var(--purple-deep)}
:root[data-theme="dark"] .btn-primary{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#170E19}}
.btn-green{background:var(--green);color:#1d3405}
.btn-green:hover{filter:brightness(.95)}
.btn-ghost{background:transparent;color:var(--purple);box-shadow:inset 0 0 0 2px var(--purple-line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 2px var(--purple)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.heart{color:var(--red)}
.menu-btn{display:none;margin-left:auto;background:var(--purple-soft);border:0;border-radius:12px;width:44px;height:44px;cursor:pointer;color:var(--purple);font-size:1.3rem}
@media (max-width:900px){
  .links{display:none;position:absolute;top:76px;left:0;right:0;background:var(--bg);flex-direction:column;padding:12px 24px 20px;border-bottom:1px solid var(--line)}
  .links.open{display:flex}
  .menu-btn{display:block}
  .nav .btn-primary.hdr{display:none}
}

/* sections */
section{padding:84px 0}
.lead{font-size:1.2rem;color:var(--ink-2);max-width:56ch}
.kicker{color:var(--green-ink);font-weight:700;font-size:.95rem;margin-bottom:12px;display:block}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px}
.tag.verified{background:var(--green-soft);color:var(--green-ink)}
.tag.sample{background:#FFF1E0;color:#8A4B00}
:root[data-theme="dark"] .tag.sample{background:#3A2A14;color:#F3C27A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.sample{background:#3A2A14;color:#F3C27A}}
.tag.demo{background:var(--purple-soft);color:var(--purple)}

/* hero */
.hero{padding:70px 0 90px;background:
  radial-gradient(600px 400px at 85% 30%, var(--purple-soft), transparent 70%),
  radial-gradient(500px 300px at 10% 100%, var(--green-soft), transparent 70%)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{margin:6px 0 22px}
.hero h1 .line2{display:block;color:var(--purple)}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:36px;color:var(--ink-2);font-size:.93rem}
.trust span{display:flex;gap:8px;align-items:center}
.trust i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.hero-art{position:relative;aspect-ratio:1/0.95}
.hero-art svg.heartline{position:absolute;inset:0;width:100%;height:100%}
.heartline path{fill:none;stroke-linecap:round}
.hero-chat{position:absolute;left:12%;right:10%;top:22%;display:flex;flex-direction:column;gap:12px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:.95rem;box-shadow:var(--shadow);max-width:85%;opacity:0;transform:translateY(8px);animation:pop .5s ease forwards}
.bub.me{align-self:flex-end;background:var(--purple);color:#fff;border-color:transparent;border-radius:20px 20px 6px 20px}
:root[data-theme="dark"] .bub.me{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bub.me{color:#170E19}}
.bub.rec{border-left:4px solid var(--green)}
.bub:nth-child(1){animation-delay:.3s}.bub:nth-child(2){animation-delay:1.1s}.bub:nth-child(3){animation-delay:1.9s}
@keyframes pop{to{opacity:1;transform:none}}
.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:900px){.cause-grid{grid-template-columns:1fr 1fr}}@media (max-width:600px){.cause-grid{grid-template-columns:1fr}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:460px;margin:0 auto;width:100%}}

/* journey path */
.journey{background:var(--bg-2);border-block:1px solid var(--line)}
.journey-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.path{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.path::before{content:"";position:absolute;top:27px;left:7%;right:7%;height:3px;background:linear-gradient(90deg,var(--purple),var(--green));border-radius:3px}
.path li{text-align:center;position:relative;padding:0 6px}
.path .dot{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;background:var(--card);border:3px solid var(--purple);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--purple);position:relative;z-index:1}
.path li:nth-child(n+5) .dot{border-color:var(--green);color:var(--green-ink)}
.path b{display:block;font-family:var(--display);font-size:1.02rem}
.path span{display:block;color:var(--muted);font-size:.86rem;margin-top:4px}
@media (max-width:900px){
  .path{grid-template-columns:1fr;gap:18px}
  .path::before{top:10px;bottom:10px;left:27px;right:auto;width:3px;height:auto;background:linear-gradient(180deg,var(--purple),var(--green))}
  .path li{display:grid;grid-template-columns:56px 1fr;gap:16px;text-align:left;align-items:center}
  .path .dot{margin:0}
}

/* causes */
.cause-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px}
.cause{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px}
.cause .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--purple-soft);color:var(--purple)}
.cause:nth-child(even) .ic{background:var(--green-soft);color:var(--green-ink)}
.cause p{color:var(--ink-2);font-size:.95rem;flex:1}
.linkbtn{background:none;border:0;padding:0;color:var(--purple);font-weight:700;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* value chain */
.value{background:var(--purple-deep);color:#fff}
.value h2,.value h3{color:#fff}
.value .lead{color:#EBD7EC}
:root[data-theme="dark"] .value{background:#2A1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .value{background:#2A1530}}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:48px;counter-reset:c}
.link{position:relative;padding:28px 22px;border-top:3px solid rgba(255,255,255,.18)}
.link::before{content:"";position:absolute;top:-9px;left:22px;width:15px;height:15px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(125,179,63,.25)}
.link b{font-family:var(--display);font-size:1.4rem;display:block;margin-bottom:6px}
.link p{color:#E5D2E6;font-size:.95rem}
.link .act{margin-top:14px;font-size:.82rem;color:#CFE6B1}
@media (max-width:900px){.chain{grid-template-columns:1fr}.link{border-top:0;border-left:3px solid rgba(255,255,255,.18);padding:6px 0 26px 28px}.link::before{top:8px;left:-9px}}

/* app frame */
.app{padding:40px 0 90px;min-height:70vh;background:var(--bg-2)}
.stepper{display:flex;gap:6px;margin-bottom:34px;overflow-x:auto;padding-bottom:4px}
.stepper div{flex:1;min-width:92px}
.stepper i{display:block;height:5px;border-radius:5px;background:var(--line);margin-bottom:8px;transition:background .4s}
.stepper span{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.stepper .done i{background:var(--green)}
.stepper .now i{background:var(--purple)}
.stepper .now span{color:var(--purple)}
.screen-head{margin-bottom:28px}
.screen-head p{color:var(--ink-2);margin-top:10px;font-size:1.08rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1.35fr .9fr;gap:26px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.back{background:none;border:0;color:var(--ink-2);cursor:pointer;font-weight:600;padding:6px 0;margin-bottom:14px}
.back:hover{color:var(--purple)}

/* assistant */
.convo{display:flex;flex-direction:column;gap:14px;min-height:360px}
.msg{display:flex;gap:12px;align-items:flex-end;max-width:92%;animation:pop .4s ease forwards;opacity:0}
.msg .av{flex:0 0 38px;height:38px;border-radius:50%;background:var(--purple);display:grid;place-items:center;color:#fff}
.msg .say{background:var(--purple-soft);border-radius:20px 20px 20px 6px;padding:13px 17px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .say{background:var(--purple);color:#fff;border-radius:20px 20px 6px 20px}
:root[data-theme="dark"] .msg.me .say,:root[data-theme="dark"] .msg .av{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.me .say,:root:not([data-theme="light"]) .msg .av{color:#170E19}}
.msg.me .av{background:var(--green)}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--purple);opacity:.4;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.chip{background:var(--card);border:2px solid var(--purple-line);border-radius:999px;padding:11px 18px;cursor:pointer;font-weight:600;color:var(--ink);text-align:left;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--purple);background:var(--purple-soft)}
.rec-card{border:2px solid var(--green);border-radius:22px;padding:22px;background:linear-gradient(180deg,var(--green-soft),var(--card) 70%);margin-top:6px}
.rec-card h3{font-size:1.6rem;margin:8px 0 8px}
.rec-card dl{margin:14px 0 0;display:grid;gap:12px}
.rec-card dt{font-weight:700;font-size:.9rem;color:var(--green-ink)}
.rec-card dd{margin:2px 0 0;color:var(--ink-2)}

/* giving path side panel */
.gp h3{display:flex;align-items:center;gap:10px}
.gp ol{list-style:none;margin:20px 0 0;padding:0;position:relative}
.gp ol::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;width:2px;background:var(--line)}
.gp li{position:relative;padding:0 0 22px 44px}
.gp li::before{content:"";position:absolute;left:5px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid var(--line);transition:all .3s}
.gp li.set::before{background:var(--green);border-color:var(--green)}
.gp small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.gp strong{display:block;font-size:1.02rem}
.gp .empty{color:var(--muted);font-style:italic;font-weight:400}

/* amount */
.chosen{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:20px;background:var(--purple-soft);margin-bottom:26px}
.chosen .ic{width:52px;height:52px;border-radius:16px;background:var(--purple);color:#fff;display:grid;place-items:center;flex:0 0 52px}
:root[data-theme="dark"] .chosen .ic{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chosen .ic{color:#170E19}}
.chosen b{font-family:var(--display);font-size:1.5rem;display:block;line-height:1.1}
.tabs{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:5px;gap:4px;margin:6px 0 22px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:11px 22px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--purple);color:#fff;box-shadow:0 6px 14px -8px var(--purple)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#170E19}}
.amounts{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:640px){.amounts{grid-template-columns:repeat(2,1fr)}}
.amt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:20px 10px;cursor:pointer;text-align:center;transition:all .15s;position:relative}
.amt b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1}
.amt span{font-size:.82rem;color:var(--muted);font-weight:600}
.amt:hover{border-color:var(--purple)}
.amt[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-soft)}
.amt .ai{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--green);color:#1d3405;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.custom{display:none;margin-top:16px;align-items:center;gap:10px;flex-wrap:wrap}
.custom.show{display:flex}
.money{display:flex;align-items:center;border:2px solid var(--purple);border-radius:16px;overflow:hidden;background:var(--card)}
.money span{padding:0 14px;font-weight:800;color:var(--purple);font-size:1.2rem}
.money input{border:0;outline:0;padding:14px 14px 14px 0;width:150px;font-size:1.2rem;font-weight:700;background:transparent}
.airec{margin-top:28px;border-radius:24px;padding:26px;background:var(--purple-deep);color:#fff;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
:root[data-theme="dark"] .airec{background:#341A3A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .airec{background:#341A3A}}
.airec h3{color:#fff;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.airec .big{font-family:var(--display);font-size:2.6rem;font-weight:800;color:#fff;margin:6px 0}
.airec p{color:#EBD7EC}
.airec .nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.airec .nums div{background:rgba(255,255,255,.09);border-radius:16px;padding:14px}
.airec .nums small{color:#D9BFDA;font-size:.8rem;display:block}
.airec .nums b{font-family:var(--display);font-size:1.5rem}
.airec .acts{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap}
.airec .btn-ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
@media (max-width:760px){.airec{grid-template-columns:1fr}}
.note{font-size:.85rem;color:var(--muted);margin-top:14px}

/* plan */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:26px 0}
.flow div{position:relative;text-align:center;padding:20px 10px;background:var(--bg-2);border:1px solid var(--line)}
.flow div:first-child{border-radius:18px 0 0 18px;background:var(--purple);color:#fff;border-color:var(--purple)}
:root[data-theme="dark"] .flow div:first-child{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flow div:first-child{color:#170E19}}
.flow div:last-child{border-radius:0 18px 18px 0;background:var(--green-soft);border-color:var(--green)}
.flow b{font-family:var(--display);display:block;font-size:1.05rem}
.flow small{font-size:.8rem;opacity:.8}
@media (max-width:640px){.flow{grid-template-columns:1fr}.flow div:first-child{border-radius:18px 18px 0 0}.flow div:last-child{border-radius:0 0 18px 18px}}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.summary div{border:1px solid var(--line);border-radius:18px;padding:16px}
.summary small{color:var(--muted);font-weight:600;font-size:.82rem;display:block}
.summary b{font-family:var(--display);font-size:1.3rem}
@media (max-width:760px){.summary{grid-template-columns:1fr 1fr}}

/* checkout */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
label.f input{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 15px;font-size:1rem}
label.f input:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 4px var(--purple-soft)}
.demo-pay{margin-top:24px;border:2px dashed var(--red);border-radius:20px;padding:20px;position:relative}
.demo-pay .warn{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:.82rem;padding:6px 12px;border-radius:999px;margin-bottom:14px;letter-spacing:.02em}
.order{position:sticky;top:110px}
.order .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.order .row:last-of-type{border:0}
.order .row span{color:var(--muted)}
.order .total{font-family:var(--display);font-size:1.8rem;font-weight:800;color:var(--purple)}

/* success */
.success{text-align:center;max-width:760px;margin:0 auto}
.success .mark{width:92px;height:92px;margin:0 auto 22px}
.success .mark path{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.2s .2s ease-out forwards}
.success h1{font-size:clamp(2rem,4.5vw,3.2rem)}
.success .lead{margin:14px auto 30px}
.ministats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px;text-align:left}
.ministats div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.ministats small{color:var(--muted);font-weight:600;display:block;font-size:.82rem}
.ministats b{font-family:var(--display);font-size:1.45rem}
@media (max-width:640px){.ministats{grid-template-columns:1fr}}
.next{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.stats small{color:var(--muted);font-weight:600;font-size:.84rem;display:block}
.stats b{font-family:var(--display);font-size:1.8rem;display:block;margin-top:4px}
.stats div:first-child{background:var(--purple);border-color:var(--purple)}
.stats div:first-child small,.stats div:first-child b{color:#fff}
:root[data-theme="dark"] .stats div:first-child small,:root[data-theme="dark"] .stats div:first-child b{color:#170E19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stats div:first-child small,:root:not([data-theme="light"]) .stats div:first-child b{color:#170E19}}
@media (max-width:800px){.stats{grid-template-columns:1fr 1fr}}
.stories{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
@media (max-width:900px){.stories{grid-template-columns:1fr}}
.story{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.story .pic{height:120px;display:grid;place-items:center;background:var(--purple-soft);color:var(--purple)}
.story:nth-child(2) .pic{background:var(--green-soft);color:var(--green-ink)}
.story .body{padding:18px;display:flex;flex-direction:column;gap:8px}
.story p{color:var(--ink-2);font-size:.95rem}
.ai-update{display:flex;gap:16px;align-items:flex-start;padding:20px;border-radius:20px;background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 40%,transparent)}
.ai-update .av{flex:0 0 44px;height:44px;border-radius:14px;background:var(--green);display:grid;place-items:center;color:#1d3405}

/* fundraise */
.gen{display:flex;flex-direction:column;gap:16px}
.gen-block{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--bg)}
.gen-block h4{font-family:var(--body);font-size:.85rem;color:var(--purple);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.gen-block p{white-space:pre-line;color:var(--ink-2)}
.campaign-title{font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1.1}
.bar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--green));border-radius:999px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.raised{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.raised b{font-family:var(--display);font-size:2rem}
.copy{background:none;border:0;color:var(--purple);font-weight:700;cursor:pointer;font-size:.82rem}
.shimmer{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--purple-soft),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
select.sel{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 15px;font-size:1rem}

/* my hff */
.recs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.recs{grid-template-columns:1fr}}
.recs .panel{padding:24px;display:flex;flex-direction:column;gap:12px}
.recs .panel p{color:var(--ink-2)}
.history{width:100%;border-collapse:collapse;font-size:.95rem}
.history th{text-align:left;color:var(--muted);font-weight:600;font-size:.84rem;padding:10px 8px;border-bottom:1px solid var(--line)}
.history td{padding:12px 8px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}

footer{background:var(--bg-2);border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:600;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sticky-give{display:none}
@media (max-width:640px){
  .sticky-give{display:flex;position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:45;gap:10px}
  .sticky-give .btn{flex:1;padding:13px}
  body.home-view{padding-bottom:76px}
  section{padding:60px 0}
  .panel{padding:22px}
}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.bub,.msg{opacity:1;transform:none}.draw,.success .mark path{stroke-dashoffset:0}}
</style>
</head>

/* ---------- router ---------- */
function go(view){
  $('#links').classList.remove('open');
  document.body.classList.toggle('home-view', view==='home'||view==='causes'||view==='value');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on', b.dataset.nav===view || (view==='home' && b.dataset.nav==='home')));
  if(view==='causes'||view==='value'){ if(!$('#home-root')) render.home(); document.getElementById(view)?.scrollIntoView({behavior:'smooth'}); return; }
  if(view==='donate'){ if(!S.cause) S.cause='general'; view='amount'; }
  (render[view]||render.home)();
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault();go(g.dataset.go)}
});

render.assistant = ()=>{
  S.convo=[]; S.cause=null;
  main.innerHTML = `<div class="app"><div class="wrap">

function paintPath(){

function addMsg(html, me=false){
  const c=$('#convo'); const d=document.createElement('div');
  d.className='msg'+(me?' me':''); d.innerHTML=`<div class="av">${me?'You'.slice(0,1):ICONS.spark}</div><div class="say">${html}</div>`;
  c.appendChild(d); d.scrollIntoView({block:'nearest',behavior:'smooth'}); return d;
}
function aiSay(html, then, delay=900){
  const t=addMsg('<span class="typing"><i></i><i></i><i></i></span>');
  setTimeout(()=>{t.querySelector('.say').innerHTML=html; then&&then()}, delay);
}
function showChoices(list, cb){
  const c=$('#convo'); const w=document.createElement('div'); w.className='choices';
  list.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{w.remove();addMsg(esc(l),true);cb(k,l)};w.appendChild(b)});
  c.appendChild(w);
}
function pickInterest(k,l){
  S.interest=k; S.interestLabel=l.replace(/^I want to support /,'').replace(/^./,m=>m.toUpperCase());

    aiSay('No problem. Who would you most like your gift to reach?', ()=>showChoices([
      ['youth','Children and teenagers'],['marriage','Couples'],['community','Whole villages and towns'],['general','Wherever HFF needs it most']
    ],(k2,l2)=>{S.interestLabel=l2;recommend(k2)}));

function paintAmounts(){
  const f=AMOUNTS[S.freq];

function recCopy(){

  return {lead:`Based on your interest in ${c} and ${pref}, we recommend:`,sup};
}
function paintRec(){
  const f=AMOUNTS[S.freq], rec=f.rec, a=S.amount, r=recCopy();

        <button class="btn btn-primary" data-go="impact">See My Impact</button>
        <button class="btn btn-green" data-go="fundraise">Start Fundraising</button>
        <button class="btn btn-ghost" data-go="causes">Explore More Causes</button>
      </div>
    </div>
  </div></div>`;
};

/* ---------- IMPACT ---------- */
render.impact = ()=>{
  if(!S.cause){S.cause='youth';S.freq='monthly';S.amount=25}
  const c=CAUSES[S.cause], f=AMOUNTS[S.freq];
  const total = S.freq==='monthly'? S.amount*6 : S.amount;
  const stories={
    youth:[['A school session on healthy choices','Students worked through a session on respect, peer pressure and planning for the future, led by trained facilitators.'],['Teachers bringing lessons into class','A guidance teacher plans to use the workshop topics in the school counselling programme next term.'],['Youth volunteers step up','Young people who completed a workshop are helping run a weekend session for younger teens.']],
    families:[['A household finding its footing','A family that joined a campaign is still meeting a follow-up counsellor to work on budgeting together.'],['Small groups still meeting','Several groups formed during a campaign continue to meet each week for encouragement.'],['Help connecting to services','Follow-up staff linked a family to local support for a specific need.']],
    marriage:[['A couple learning to talk again','After a seminar, a couple described how a single chapter on communication changed their evenings at home.'],['Workbooks in two languages','Participants worked through the marriage workbook in Setswana and English.'],['Group leaders trained','New volunteer leaders were trained to run small-group sessions.']],
    community:[['A village comes together','Local leaders, police and churches joined to open a family building campaign.'],['Volunteers lead small groups','Trained volunteers taught each day’s chapter to their own neighbourhood groups.'],['Mini-campaigns begin','Volunteers started sharing what they learned in surrounding villages.']],
    media:[['A new episode in planning','The production team outlined an episode on parenting teenagers.'],['Viewers write in','A viewer shared how a tip on conflict resolution helped at home.'],['Clips shared online','Short clips from the show were shared on HFF’s social channels.']],
    general:[['Support where it’s needed','Flexible gifts helped cover workbook printing for an upcoming campaign.'],['Follow-up continues','Staff continued follow-up visits after a recent campaign.'],['Planning the next campaign','HFF began planning with local leaders for the next village campaign.']]
  }[S.cause];
  main.innerHTML=`<div class="app"><div class="wrap">
    ${back('success','Back')}
    <div class="screen-head"><h2>Your HFF impact journey</h2><p>A personal view of what you support. <span class="tag sample">Sample data</span></p></div>
    <div class="stats">
      <div><small>Donation</small><b>${fmt(S.amount)}${f.suffix.replace(' / month','/mo').replace(' / year','/yr')}</b></div>
      <div><small>Supporter since</small><b>Apr 2025</b></div>
      <div><small>Causes supported</small><b>${c.name}</b></div>
      <div><small>Total contributions</small><b>${fmt(total)}</b></div>
    </div>
    <div class="ai-update"><div class="av">${ICONS.spark}</div><div><b>Here’s an update based on the causes you’ve chosen to support.</b><p style="color:var(--ink-2);margin-top:4px">Your monthly gifts to ${c.name} have continued without a break. Below are recent stories from this programme area, written for you by the Giving Assistant.</p></div></div>
    <div class="stories">${stories.map((s,i)=>`<article class="story"><div class="pic">${ICONS[c.icon]}</div><div class="body"><span class="tag sample">Sample Impact Content</span><h3>${s[0]}</h3><p>${s[1]}</p></div></article>`).join('')}</div>
    <p class="note">Sample Impact Content is placeholder text for this demo. Live updates would come from HFF’s programme reports, not from AI invention.</p>
    <div class="next" style="justify-content:flex-start;margin-top:24px">
      <button class="btn btn-green" data-go="fundraise">Start Fundraising</button>
      <button class="btn btn-ghost" data-go="myhff">Go to My HFF</button>
    </div>
  </div></div>`;
};

/* ---------- FUNDRAISE ---------- */
render.fundraise = ()=>{
  const cur=S.cause||'youth';
  main.innerHTML=`<div class="app"><div class="wrap">
    ${back('myhff','My HFF')}
    <div class="screen-head"><h2>Want to make an even bigger difference?</h2><p>Let AI help you create an HFF fundraising campaign.</p></div>
    <div class="two">
      <form class="panel" id="fForm">
        <div class="form">
          <label class="f full">Campaign name<input id="cn" value="Run for Healthy Families"></label>
          <label class="f">Cause<select class="sel" id="cc">${Object.entries(CAUSES).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v.name}</option>`).join('')}</select></label>
          <label class="f">Fundraising goal (USD)<input id="cg" type="number" min="50" value="2000"></label>
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:20px">${ICONS.spark} Create My Campaign</button>
      </form>
      <aside class="panel" id="preview"><h3>Campaign preview</h3><p class="note">Your AI-written campaign appears here.</p></aside>
    </div>
  </div></div>`;
  $('#fForm').onsubmit=e=>{
    e.preventDefault();
    const name=$('#cn').value.trim()||'My HFF Campaign', cause=CAUSES[$('#cc').value], goal=Math.max(50,+$('#cg').value||2000);
    $('#preview').innerHTML=`<h3>Writing your campaign…</h3>${'<div class="shimmer"></div>'.repeat(7)}`;
    setTimeout(()=>{
      const raised=Math.round(goal*0.425), pct=Math.floor(raised/goal*100), first=S.donor.first||'I';
      const me = S.donor.first? S.donor.first : 'I';
      S.campaign={name,cause:cause.name,goal,raised,pct};
      const story=`${me==='I'?'I’m':me+' is'} raising ${fmt(goal)} for Healthy Families Foundation’s ${cause.name}. ${cause.desc} HFF offers its programmes free to the public, so they depend on supporters. Every gift, big or small, helps keep this work going.`;
      const msg=`Strong families build strong communities. Will you help me reach ${fmt(goal)} for ${cause.name}?`;
      const social=`I’m taking on “${name}” to support @healthyfamiliesfoundation and their ${cause.name.toLowerCase()} work. Every dollar helps. Join me 💜💚 #HealthyFamilies #FixTheRoot`;
      const email=`Subject: Will you support my HFF campaign?\n\nHi,\n\nI’ve started “${name}” to raise ${fmt(goal)} for Healthy Families Foundation. Their ${cause.name.toLowerCase()} work helps families build healthier, happier homes.\n\nIf you can give any amount, it would mean a lot.\n\nThank you,\n${S.donor.first||'[Your name]'}`;
      const blk=(t,b)=>`<div class="gen-block"><h4>${t}<button class="copy" type="button" data-copy>Copy</button></h4><p>${esc(b)}</p></div>`;
      $('#preview').innerHTML=`<div class="gen">
        <div><span class="tag demo">AI-generated preview</span><div class="campaign-title" style="margin-top:10px">${esc(name)}</div><p class="note" style="margin-top:4px">Supporting ${cause.name}</p></div>
        <div><div class="raised"><b>${fmt(raised)} raised</b><span style="color:var(--muted);font-weight:600">of ${fmt(goal)} goal</span></div>
        <div class="bar"><i id="barFill"></i></div>
        <div class="raised"><span><b style="font-size:1.1rem">${pct}%</b> funded</span><span><b style="font-size:1.1rem">24</b> supporters</span></div>
        <span class="tag sample" style="margin-top:8px">Sample progress</span></div>
        ${blk('Campaign story',story)}${blk('Fundraising message',msg)}${blk('Social media post',social)}${blk('Email appeal',email)}
        <button class="btn btn-green" type="button" id="shareBtn">Share Campaign</button>
      </div>`;
      requestAnimationFrame(()=>setTimeout(()=>$('#barFill').style.width=pct+'%',60));
      $('#preview').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const t=b.closest('.gen-block').querySelector('p').textContent;navigator.clipboard?.writeText(t).then(()=>toast('Copied to clipboard'),()=>toast('Copy not available here'))});
      $('#shareBtn').onclick=()=>toast('Demo: a shareable campaign link would be created here');
    },1600);
  };
};

/* ---------- MY HFF ---------- */
render.myhff = ()=>{
  const cause=S.cause?CAUSES[S.cause].name:'Youth Programmes';
  const cur=S.amount?`${fmt(S.amount)}${AMOUNTS[S.freq].suffix.replace(' / month',' / Month').replace(' / year',' / Year')}`:'$25 / Month';
  main.innerHTML=`<div class="app"><div class="wrap">
    <div class="screen-head" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end">
      <div><h2>My HFF${S.donor.first?', '+esc(S.donor.first):''}</h2><p>Your giving, your fundraising and what’s next. <span class="tag sample">Sample data</span></p></div>
      <button class="btn btn-primary" data-go="donate">♥ Give again</button>
    </div>
    <div class="stats">
      <div><small>Total donated</small><b>$650</b></div>
      <div><small>Current giving</small><b>${cur}</b></div>
      <div><small>Causes supported</small><b>3</b></div>
      <div><small>Fundraising</small><b>${S.campaign?fmt(S.campaign.raised):'$1,200'}</b></div>
    </div>
    <p class="note" style="margin:-10px 0 28px">Supporter since April 2025</p>
    <h3 style="display:flex;gap:8px;align-items:center;margin-bottom:14px">${ICONS.spark} AI recommendations for you</h3>
    <div class="recs">
      <div class="panel"><span class="tag demo">New campaign</span><h3>A new family building campaign is being planned</h3><p>You previously supported ${cause}. You may be interested in this new HFF campaign.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" data-go="donate">Support Again</button><button class="btn btn-ghost" data-go="causes">Explore Causes</button></div></div>
      <div class="panel"><span class="tag verified">Giving tip</span><h3>Simplify with one annual gift</h3><p>You currently make monthly contributions. Would you like to explore annual giving?</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-green" id="annualBtn">Make Annual Donation</button><button class="btn btn-ghost" data-go="fundraise">Start Fundraising</button></div></div>
    </div>
    <div class="panel" style="margin-top:22px">
      <h3>Giving history</h3>
      <div class="tablewrap"><table class="history" style="margin-top:10px">
        <thead><tr><th>Date</th><th>Cause</th><th>Type</th><th>Amount</th></tr></thead>
        <tbody>
          <tr><td>Oct 2026</td><td>${cause}</td><td>Monthly</td><td>${S.amount?fmt(S.amount):'$25'}</td></tr>
          <tr><td>Aug 2026</td><td>Community Campaigns</td><td>One-time</td><td>$250</td></tr>
          <tr><td>Dec 2025</td><td>HFF Media & TV</td><td>One-time</td><td>$100</td></tr>
          <tr><td>Apr 2025 – Sep 2026</td><td>${cause}</td><td>Monthly</td><td>$275 total</td></tr>
        </tbody></table></div>
    </div>
  </div></div>`;
  $('#annualBtn').onclick=()=>{S.freq='annual';S.amount=AMOUNTS.annual.rec;S.custom=false;if(!S.cause)S.cause='youth';go('amount')};
};

go('home');
</script>
</body>
</html>
